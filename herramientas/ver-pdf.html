<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor de programas</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #e2e8f0; }
      form { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: #1d4ed8; color: white; position: sticky; top: 0; }
      select, input, button { font: inherit; padding: 4px 8px; }
      #paginas { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }
      canvas { background: white; box-shadow: 0 1px 4px #0003; max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <form id="f">
      <select id="archivo" aria-label="Programa"></select>
      <label>Páginas <input id="desde" type="number" min="1" value="1" style="width:4em" /> a
        <input id="hasta" type="number" min="1" value="1" style="width:4em" /></label>
      <button>Ver</button>
    </form>
    <div id="paginas"></div>
    <script type="module">
      // Herramienta de revisión: muestra páginas de los PDF de PROGRAMAS/ (solo en desarrollo, npm run dev).
      import * as pdfjs from 'pdfjs-dist';
      import worker from 'pdfjs-dist/build/pdf.worker.min.mjs?url';
      pdfjs.GlobalWorkerOptions.workerSrc = worker;

      const ARCHIVOS = Object.keys(import.meta.glob('/PROGRAMAS/*.pdf', { query: '?url' })).map((p) => p.replace('/PROGRAMAS/', ''));
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      for (const a of ARCHIVOS) $('archivo').add(new Option(a.replace('.pdf', ''), a));
      if (params.get('archivo')) $('archivo').value = params.get('archivo');
      $('desde').value = params.get('desde') ?? 1;
      $('hasta').value = params.get('hasta') ?? params.get('desde') ?? 1;

      async function mostrar() {
        const cont = $('paginas');
        cont.replaceChildren();
        const pdf = await pdfjs.getDocument({ url: '/PROGRAMAS/' + encodeURIComponent($('archivo').value) }).promise;
        const hasta = Math.min(+$('hasta').value, pdf.numPages);
        for (let n = +$('desde').value; n <= hasta; n++) {
          const pagina = await pdf.getPage(n);
          const vp = pagina.getViewport({ scale: 1.6 });
          const c = document.createElement('canvas');
          c.width = vp.width;
          c.height = vp.height;
          c.title = 'Página ' + n;
          cont.append(c);
          await pagina.render({ canvas: c, viewport: vp }).promise;
        }
      }
      $('f').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = new URLSearchParams({ archivo: $('archivo').value, desde: $('desde').value, hasta: $('hasta').value });
        history.replaceState(null, '', '?' + q);
        mostrar();
      });
      mostrar();
    </script>
  </body>
</html>
