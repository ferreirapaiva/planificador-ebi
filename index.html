<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="Planificaciones docentes a partir de los programas de Educación Básica Integrada (ANEP, Uruguay)." />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>Planificador EBI</title>
    <script>
      /* Tema claro u oscuro antes de que cargue la app, para que no haya un destello. */
      try {
        var t = localStorage.getItem('planificador-ebi:tema') || 'auto';
        var oscuro = t === 'oscuro' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
